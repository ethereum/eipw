<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>markdown-no-duplicate-section</title>
		<link rel="stylesheet" href="../main.css">
		<meta name="viewport" content="width=device-width, initial-scale=1">
	</head>
	<body>
		<article>
			<h1><code>markdown-no-duplicate-section</code></h1>
			<p>Level-two section headings must be unique.</p>
			<section>
				<h2>Explanation</h2>
				<p>
					A proposal should contain each top-level body section only once.
					When a section is repeated, the diagnostic points to both the
					first occurrence and the duplicate.
				</p>
			</section>
		</article>
	</body>
</html>
